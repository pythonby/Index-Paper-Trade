name: NSE Paper Trading Bot

# Runs entirely on GitHub's free cloud runners. Nothing installs on your PC.
#
# Backtest and live paper trading run as TWO SEPARATE JOBS in this workflow.
# GitHub Actions runs jobs in parallel by default unless one explicitly
# `needs:` the other -- neither job here does, so both start at the same
# time and run independently. This is safe because backtest never writes
# to the shared trade database (db/trading.db) -- it only computes results
# in memory and reports them via print/Telegram, so there's no conflict
# with the live engine's database reads/writes.
#
# Schedule: triggers every weekday at 9:10 AM IST (3:40 AM UTC), which is
# a few minutes before market open. NOTE: GitHub's free-tier scheduled
# workflows can be delayed -- sometimes by hours -- during high platform
# load. This is a documented GitHub limitation, not something this
# workflow can control. For guaranteed timing, trigger manually during
# market hours, or use an always-on VM instead (see README).

on:
  schedule:
    - cron: "40 3 * * 1-5"   # 3:40 AM UTC = 9:10 AM IST, Mon-Fri
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe: a number (1,3,5,15,30,60) or 'all'"
        required: false
        default: "5"
        type: string
      index:
        description: "Index: NIFTY, BANKNIFTY, FINNIFTY, or 'all'"
        required: false
        default: "all"
        type: string

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py backtest --timeframe "${{ github.event.inputs.timeframe || '5' }}" --index "${{ github.event.inputs.index || 'all' }}"

  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # GitHub's hard cap is 360 min (6h) -- stay safely under it

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore trade database from previous run
        uses: actions/download-artifact@v4
        with:
          name: trading-db-persistent
          path: db/
        continue-on-error: true

      - name: Run live paper trading until square-off
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional -- only needed if you want the live option-chain feed to
          # use Angel One's SmartAPI instead of free (and often cloud-blocked)
          # NSE scraping. Safe to leave unset: falls back to NSE automatically.
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python main.py paper --timeframe "${{ github.event.inputs.timeframe || '5' }}" --index "${{ github.event.inputs.index || 'all' }}"

      - name: Persist trade database for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-db-persistent
          path: db/trading.db
          retention-days: 90
          overwrite: true

      - name: Upload logs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
