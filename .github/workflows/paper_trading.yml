name: NSE Paper Trading Bot

# Runs entirely on GitHub's free cloud runners. Nothing installs on your PC.
#
# Backtest now lives in its OWN workflow file (.github/workflows/
# backtest.yml), split out so the two can be triggered, scheduled, and
# reasoned about independently -- this file only runs live paper trading,
# plus a "combine-dashboard" job that rebuilds reports/dashboard.xlsx after
# paper-trade finishes (it picks up whatever backtest data backtest.yml's
# own "combine" job already committed, whenever that last ran).
#
# Schedule: triggers every weekday at 9:10 AM IST (3:40 AM UTC), which is
# a few minutes before market open. NOTE: GitHub's free-tier scheduled
# workflows can be delayed -- sometimes by hours -- during high platform
# load. This is a documented GitHub limitation, not something this
# workflow can control. For guaranteed timing, trigger manually during
# market hours, or use an always-on VM instead (see README).

on:
  schedule:
    - cron: "40 3 * * 1-5"   # 3:40 AM UTC = 9:10 AM IST, Mon-Fri
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe: a number (1,3,5,15,30,60) or 'all'"
        required: false
        default: "5"
        type: string
      index:
        description: "Index: NIFTY, BANKNIFTY, FINNIFTY, or 'all'"
        required: false
        default: "all"
        type: string

# Needed so the "commit CSV" steps below can push reports/*.csv back to the
# repo (see reports/csv_log.py) -- these give you ONE always-up-to-date,
# clean table viewable straight on github.com instead of piecing results
# together from many Telegram messages.
permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # GitHub's hard cap is 360 min (6h) -- stay safely under it

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore trade database from previous run
        uses: actions/download-artifact@v4
        with:
          name: trading-db-persistent
          path: db/
        continue-on-error: true

      - name: Run live paper trading until square-off
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional -- only needed if you want the live option-chain feed to
          # use Angel One's SmartAPI instead of free (and often cloud-blocked)
          # NSE scraping. Safe to leave unset: falls back to NSE automatically.
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python -u main.py paper --timeframe "${{ github.event.inputs.timeframe || '5' }}" --index "${{ github.event.inputs.index || 'all' }}"

      - name: Commit updated trade log table
        if: always()
        continue-on-error: true   # a reporting/commit hiccup must never turn the whole run red
        run: |
          git config user.name "nse-paper-bot"
          git config user.email "actions@github.com"
          # Root cause of the earlier "exit code 128": naming files that don't
          # exist yet (no trades that day / weekend) makes git add fail.
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "No new trades to commit."
            exit 0
          fi
          git commit -m "Update trade log [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done

      - name: Persist trade database for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-db-persistent
          path: db/trading.db
          retention-days: 90
          overwrite: true

      - name: Upload logs as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

  combine-dashboard:
    # Builds reports/dashboard.xlsx (live sheets + whatever backtest sheets
    # are already committed) after paper-trade finishes. Does NOT need to
    # wait on a backtest job anymore -- backtest now runs as its own
    # workflow (backtest.yml) with its own "combine" job that commits
    # backtest data independently. This job just needs paper-trade's fresh
    # trade_log.csv to be in the checkout before rebuilding the combined file.
    needs: paper-trade
    if: always()   # still build with whatever data exists even if paper-trade failed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build combined dashboard.xlsx
        run: python -u -c "from reports.dashboard import generate_dashboard; print('Wrote', generate_dashboard())"

      - name: Commit combined dashboard
        continue-on-error: true
        run: |
          git config user.name "nse-paper-bot"
          git config user.email "actions@github.com"
          git add reports/dashboard.xlsx
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Update combined dashboard [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
